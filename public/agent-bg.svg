<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2340" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Base Background Linear Gradient -->
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#edf4fe" />
      <stop offset="35%" stop-color="#f6f8fd" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Top Left Ice/Sky Blue Gradient Blob -->
    <radialGradient id="skyBlob" cx="20%" cy="15%" r="55%" fx="15%" fy="10%">
      <stop offset="0%" stop-color="#d4ecfe" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#e0f2fe" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#edf6fe" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Top Right Lavender / Lilac Violet Gradient Blob -->
    <radialGradient id="purpleBlob" cx="82%" cy="12%" r="55%" fx="85%" fy="8%">
      <stop offset="0%" stop-color="#e4d2fb" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#ede1fd" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#f5edfe" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Center Soft Pastel Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#e8eefd" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#f4f7fe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Middle-Left Soft Aqua Glow -->
    <radialGradient id="aquaGlow" cx="10%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#e0f4fd" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#f0f9fe" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for ultra-smooth optical blending -->
    <filter id="ultraBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>

  <!-- Base Layer -->
  <rect width="1080" height="2340" fill="url(#baseGrad)" />

  <!-- Smooth Mesh Glow Blobs -->
  <g filter="url(#ultraBlur)">
    <!-- Top-Left Cyan Blob -->
    <circle cx="180" cy="320" r="480" fill="url(#skyBlob)" />
    
    <!-- Top-Right Violet Blob -->
    <circle cx="900" cy="280" r="520" fill="url(#purpleBlob)" />
    
    <!-- Mid-Left Aqua Blob -->
    <circle cx="100" cy="850" r="420" fill="url(#aquaGlow)" />
    
    <!-- Mid-Right Subtle Purple Mist -->
    <circle cx="960" cy="650" r="380" fill="#ede0fc" fill-opacity="0.45" />

    <!-- Center Diffuse Glow -->
    <circle cx="540" cy="500" r="450" fill="url(#centerGlow)" />
  </g>
</svg>
